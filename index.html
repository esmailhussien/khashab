<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khashab | Premium Wooden Boards</title>
    <meta name="description" content="Discover premium handcrafted wooden serving and cutting boards. Coming soon.">
    
    <!-- Fonts: Inter for UI, Playfair Display for elegant headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-container"></div>
    <div class="overlay"></div>

    <main class="content">
        <header class="logo-container">
            <h1 class="logo">Khashab.</h1>
        </header>

        <section class="hero-text">
            <h2 class="headline">Crafted by nature.<br>Refined by hand.</h2>
            <p class="subheadline">Our exclusive collection of premium wooden serving and cutting boards is launching soon. Join the waitlist for early access.</p>
            
            <form id="waitlist-form" class="waitlist-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Enter your email address" required autocomplete="email">
                    <button type="submit" class="btn-submit">
                        Notify Me
                    </button>
                </div>
                <p class="success-message" id="success-message" style="display: none;">Thank you! We'll be in touch soon.</p>
            </form>
        </section>

        <footer class="footer">
            <p>&copy; 2026 Khashab. All rights reserved.</p>
            <div class="social-links">
                <!-- Social Icons can be added here in the future -->
                <span>Awaiting perfection.</span>
            </div>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
